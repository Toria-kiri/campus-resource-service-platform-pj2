[project]
name = "campus-resource-service-platform"
version = "0.1.0"
description = "Campus resource service platform backend development environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false
required-version = "==0.13.1"

[tool.pytest.ini_options]
testpaths = ["backend/modules", "tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
